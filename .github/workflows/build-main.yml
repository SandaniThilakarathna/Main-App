name: Build and Publish Artifact

# Trigger the workflow on any push to the master branch
on:
  push:
    branches: [ "master" ]

jobs:
  build:
    # Use a GitHub-hosted runner
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Java Environment with Gradle caching
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # Step 3: Grant execute permission for the Gradle wrapper
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # Step 4: Compile the app and assemble the debug APK
      - name: Compile App (Assemble Debug)
        run: ./gradlew assembleDebug

      # Step 5: Upload the generated APK artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: main-app-apk
          path: app/build/outputs/apk/debug/*.apk
