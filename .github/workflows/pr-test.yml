name: PR Unit Test

# Trigger the workflow on any pull request
on:
  pull_request:

jobs:
  test:
    # Use a GitHub-hosted runner
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Java Environment with Gradle caching
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle' # Automatically caches your Kotlin/Java dependencies

      # Step 3: Grant execute permission for the Gradle wrapper
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # Step 4: Run standard JVM unit tests
      - name: Run JVM Unit Tests
        run: ./gradlew testDebugUnitTest
